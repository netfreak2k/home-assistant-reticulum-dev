name: "N2K RNS Gateway DEV"
version: "1.18.9-beta1"
slug: "reticulum_dev"
description: "Connect Home Assistant to the Reticulum Network Stack and LXMF messaging."
startup: "application"
boot: "auto"
init: false

ingress: true
ingress_port: 8100
panel_icon: "mdi:radio-tower"
panel_title: "N2K RNS Gateway"

arch:
  - amd64
  - aarch64

map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false

host_network: true
uart: true

homeassistant_api: true
hassio_api: true
hassio_role: default

options:
  messenger_name: "Home Assistant"
  auto_interface: false
  internet_bootstrap: true
  tcp_interface: false
  tcp_host: ""
  tcp_port: 4242
  rnode_interface: false
  rnode_port: ""
  rnode_frequency: 0
  rnode_bandwidth: 125000
  rnode_txpower: 0
  rnode_spreadingfactor: 8
  rnode_codingrate: 5
  transport: false
  loglevel: "info"

schema:
  messenger_name: "str"
  auto_interface: "bool"
  internet_bootstrap: "bool"
  tcp_interface: "bool"
  tcp_host: "str?"
  tcp_port: "port"
  rnode_interface: "bool"
  rnode_port: "str?"
  rnode_frequency: "int(0,1000000000)"
  rnode_bandwidth: "int(7800,1625000)"
  rnode_txpower: "int(0,37)"
  rnode_spreadingfactor: "int(5,12)"
  rnode_codingrate: "int(5,8)"
  transport: "bool"
  loglevel: "list(error|warning|notice|info|verbose|debug|path|extreme)"
