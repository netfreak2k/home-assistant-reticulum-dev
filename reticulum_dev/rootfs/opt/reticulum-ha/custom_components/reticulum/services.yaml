send_message:
  name: Send LXMF message
  description: Send a text message over Reticulum using LXMF.
  fields:
    destination_hash:
      required: true
      example: "0123456789abcdef0123456789abcdef"
      selector:
        text:
    content:
      required: true
      example: "Test über Home Assistant"
      selector:
        text:
          multiline: true
    title:
      required: false
      example: "Home Assistant"
      selector:
        text:

send_announce:
  name: Send LXMF announce
  description: Request an LXMF presence announce from N2K RNS Gateway.

refresh_status:
  name: Refresh N2K status
  description: Force an immediate refresh of the N2K Home Assistant state bridge.
