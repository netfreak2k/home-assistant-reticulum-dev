<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#010711"/>
    <stop offset=".46" stop-color="#06192b"/>
    <stop offset="1" stop-color="#02070d"/>
  </linearGradient>
  <radialGradient id="dawn" cx="76%" cy="42%" r="34%">
    <stop offset="0" stop-color="#ffd27a" stop-opacity=".54"/>
    <stop offset=".12" stop-color="#ff9b42" stop-opacity=".26"/>
    <stop offset=".42" stop-color="#1e8dce" stop-opacity=".09"/>
    <stop offset="1" stop-color="#08121d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blue">
    <stop offset="0" stop-color="#b8f7ff"/>
    <stop offset=".12" stop-color="#42ddff"/>
    <stop offset=".36" stop-color="#078cff" stop-opacity=".72"/>
    <stop offset="1" stop-color="#078cff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orange">
    <stop offset="0" stop-color="#fff0c2"/>
    <stop offset=".16" stop-color="#ffb84e"/>
    <stop offset=".42" stop-color="#ff6435" stop-opacity=".72"/>
    <stop offset="1" stop-color="#ff6435" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0b82d9" stop-opacity=".18"/>
    <stop offset=".5" stop-color="#3ddfff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#0b82d9" stop-opacity=".16"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="1080" fill="url(#dawn)"/>

<!-- stars -->
<g fill="#a9dcff" opacity=".5">
  <circle cx="74" cy="88" r="1"/><circle cx="170" cy="142" r=".8"/><circle cx="310" cy="70" r="1.1"/>
  <circle cx="468" cy="118" r=".8"/><circle cx="620" cy="62" r="1.2"/><circle cx="760" cy="144" r=".8"/>
  <circle cx="934" cy="90" r="1"/><circle cx="1080" cy="54" r=".9"/><circle cx="1218" cy="122" r="1.2"/>
  <circle cx="1400" cy="70" r=".8"/><circle cx="1580" cy="138" r="1.1"/><circle cx="1760" cy="82" r=".9"/>
  <circle cx="1860" cy="164" r=".7"/>
</g>

<!-- distant atmospheric horizon -->
<ellipse cx="960" cy="640" rx="1160" ry="340" fill="#0a2840" opacity=".55"/>
<ellipse cx="960" cy="620" rx="1060" ry="230" fill="#072038" opacity=".72"/>
<path d="M0 614 Q370 585 740 616 T1450 610 T1920 590" fill="none" stroke="url(#mesh)" stroke-width="3" opacity=".6"/>

<!-- mountains -->
<path d="M0 760 L150 650 260 706 420 560 540 688 690 590 820 718 1000 570 1140 700 1260 610 1390 735 1540 565 1670 690 1810 590 1920 670 1920 1080 0 1080Z" fill="#06111d"/>
<path d="M0 830 L190 706 350 790 520 655 705 812 900 680 1075 800 1280 670 1460 820 1630 710 1920 820 1920 1080 0 1080Z" fill="#030a11"/>

<!-- radio tower on right -->
<g transform="translate(1635 430)" stroke="#243c4f" fill="none" opacity=".92">
  <path d="M70 0 L15 360 M70 0 L125 360 M28 275 L112 275 M38 210 L102 210 M48 145 L92 145 M56 90 L84 90" stroke-width="6"/>
  <path d="M15 360 L125 360" stroke-width="8"/>
  <circle cx="70" cy="0" r="5" fill="#ff7142" stroke="none"/>
  <circle cx="70" cy="0" r="32" fill="url(#orange)" opacity=".55" stroke="none"/>
</g>

<!-- mesh arcs -->
<g fill="none" stroke-linecap="round">
  <path d="M90 865 Q330 500 620 800" stroke="#27cfff" stroke-width="2" opacity=".62"/>
  <path d="M240 820 Q610 450 930 760" stroke="#159dff" stroke-width="2" opacity=".52"/>
  <path d="M480 870 Q820 500 1115 775" stroke="#41ddff" stroke-width="2" opacity=".56"/>
  <path d="M720 820 Q1080 430 1390 735" stroke="#158dff" stroke-width="2" opacity=".5"/>
  <path d="M1020 830 Q1370 500 1690 775" stroke="#35d9ff" stroke-width="2" opacity=".56"/>
  <path d="M1220 820 Q1500 570 1870 760" stroke="#ff6941" stroke-width="1.6" opacity=".38"/>
  <path d="M160 920 Q620 675 1060 860 T1800 835" stroke="#27cfff" stroke-width="1.4" opacity=".34"/>
</g>

<!-- connecting mesh lines -->
<g stroke="#25cfff" stroke-width="1" opacity=".26">
  <path d="M120 865 L330 760 L520 815 L710 690 L900 780 L1110 685 L1315 760 L1510 650 L1770 750"/>
  <path d="M260 930 L480 825 L720 900 L930 805 L1180 875 L1405 785 L1640 865"/>
  <path d="M410 730 L620 650 L850 720 L1070 630 L1310 720 L1530 645 L1790 710"/>
</g>

<!-- nodes -->
<g>
  <g transform="translate(330 760)"><circle r="48" fill="url(#blue)" opacity=".38"/><circle r="5" fill="#74eeff"/></g>
  <g transform="translate(520 815)"><circle r="58" fill="url(#orange)" opacity=".32"/><circle r="5" fill="#ffb24a"/></g>
  <g transform="translate(710 690)"><circle r="55" fill="url(#blue)" opacity=".42"/><circle r="5" fill="#59eaff"/></g>
  <g transform="translate(900 780)"><circle r="70" fill="url(#blue)" opacity=".46"/><circle r="6" fill="#72f0ff"/></g>
  <g transform="translate(1110 685)"><circle r="55" fill="url(#orange)" opacity=".32"/><circle r="5" fill="#ffad48"/></g>
  <g transform="translate(1315 760)"><circle r="65" fill="url(#blue)" opacity=".4"/><circle r="6" fill="#64ebff"/></g>
  <g transform="translate(1510 650)"><circle r="72" fill="url(#blue)" opacity=".44"/><circle r="6" fill="#6bf1ff"/></g>
  <g transform="translate(1770 750)"><circle r="58" fill="url(#orange)" opacity=".35"/><circle r="5" fill="#ff9750"/></g>
  <g transform="translate(480 825)"><circle r="38" fill="url(#blue)" opacity=".32"/><circle r="4" fill="#5ce9ff"/></g>
  <g transform="translate(1180 875)"><circle r="42" fill="url(#blue)" opacity=".3"/><circle r="4" fill="#5beaff"/></g>
</g>

<!-- ambient cyan mist -->
<ellipse cx="1000" cy="760" rx="820" ry="180" fill="#009ce0" opacity=".06" filter="url(#soft)"/>
<rect width="1920" height="1080" fill="#000b13" opacity=".08"/>
</svg>